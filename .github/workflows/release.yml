name: Publish Sublime package
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/check.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LSP-Forge
          path: dist
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "LSP-Forge $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
