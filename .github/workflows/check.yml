name: Sublime package
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/build-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: LSP-Forge
          path: dist/*
  sublime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned editor used for syntax validation
        run: |
          curl --fail --location --retry 2 --max-time 180 https://download.sublimetext.com/sublime_text_build_4215_x64.tar.xz -o /tmp/sublime.tar.xz
          echo 'c153f418d3ab26b90ecce8c02a82e4e961025ed7a65f7e25060a5457d43e88d9  /tmp/sublime.tar.xz' | sha256sum --check
          tar -xf /tmp/sublime.tar.xz -C /tmp
      - name: Fetch independent Forge syntax release and fixture
        run: |
          curl --fail --location --retry 2 --max-time 180 https://github.com/forge-language/sublime-syntax/releases/download/v0.1.0/Forge.sublime-package -o /tmp/Forge.sublime-package
          echo 'd230dcb151974f792fca331a2bf384b5811534635db36ff0f2947bebcb9270a5  /tmp/Forge.sublime-package' | sha256sum --check
          curl --fail --location --retry 2 --max-time 180 https://raw.githubusercontent.com/forge-language/sublime-syntax/v0.1.0/tests/syntax_test_forge.fg -o /tmp/syntax_test_forge.fg
          echo '764981246837575c37e8eb31ec490161982fafcb05798e47f64d640a9b013f18  /tmp/syntax_test_forge.fg' | sha256sum --check
      - run: python3 scripts/build-package.py
      - run: python3 scripts/test-sublime.py --sublime /tmp/sublime_text/sublime_text --syntax-archive /tmp/Forge.sublime-package --fixture /tmp/syntax_test_forge.fg --result /tmp/sublime-result.json
      - name: Ensure incorrect scopes fail in the optimized plugin host
        run: |
          printf 'native main {}\n// <- storage.never.forge\n' > /tmp/negative.fg
          if python3 scripts/test-sublime.py --sublime /tmp/sublime_text/sublime_text --syntax-archive /tmp/Forge.sublime-package --fixture /tmp/negative.fg --result /tmp/sublime-negative.json; then
            echo 'Incorrect syntax scopes unexpectedly passed'
            exit 1
          fi
          python3 -c 'import json; r=json.load(open("/tmp/sublime-negative.json")); assert r["errors"] and "does not match storage.never.forge" in r["errors"][0]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sublime-editor-validation
          path: /tmp/sublime-result.json
